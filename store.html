<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INF1900-1012 — Boutique</title>
    <link rel="icon" type="image/png" href="https://cours.polymtl.ca/inf1900/images/favicon-144x144.png">
    <meta name="description" content="Boutique fictive hommage du projet INF1900-1012 avec chandails personnalisés et panier interactif.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_CA">
    <meta property="og:title" content="INF1900-1012 — Boutique">
    <meta property="og:description" content="Découvrez la boutique hommage INF1900-1012 et ses chandails à prix inestimable.">
    <meta property="og:image" content="https://cours.polymtl.ca/inf1900/images/logo_poly.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="store">
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="index.html">
                <img class="brand-logo" src="https://cours.polymtl.ca/inf1900/images/logo_poly.png" alt="Logo Polytechnique Montréal">
                <span>INF1900-1012</span>
            </a>
            <nav>
                <a href="index.html" data-nav="index">Accueil</a>
                <a href="poster.html" data-nav="poster">Affiche</a>
                <a href="scrum.html" data-nav="scrum">Scrum</a>
                <a href="acknowledgements.html" data-nav="acknowledgements">Remerciements</a>
                <a href="store.html" data-nav="store">Boutique</a>
            </nav>
            <div class="header-actions">
                <button id="themeToggle" class="btn-icon" aria-label="Basculer le thème">
                    <span id="themeIcon">🌙</span>
                </button>
                <button id="cartButton" class="btn cart-btn" aria-label="Ouvrir le panier">
                    Panier
                    <span id="cartCount" class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card section-head">
            <p class="eyebrow">Collection hommage</p>
            <h1>Boutique fictive des visages INF1900-1012</h1>
            <p>Chaque chandail met à l'honneur une personne du programme. Prix: <strong>Inestimable</strong>.</p>
        </section>

        <section id="storeGrid" class="store-grid"></section>
    </main>

    <aside id="cartDrawer" class="cart-drawer" aria-hidden="true">
        <div class="cart-header">
            <h2>Votre panier</h2>
            <button id="closeCart" class="btn-icon" aria-label="Fermer le panier">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <p id="cartSummary">0 article • Total: Inestimable</p>
            <button id="checkoutBtn" class="btn" type="button">Passer une commande symbolique</button>
        </div>
    </aside>

    <div id="overlay" class="overlay" hidden></div>

    <script src="script.js"></script>
</body>
</html>
